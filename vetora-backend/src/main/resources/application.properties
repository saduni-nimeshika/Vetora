# Datasource ? override in production via env vars (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vetora_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA / Hibernate Configurations
# ddl-auto=update is convenient for local dev (auto-creates/alters tables) but
# risky in production (no rollback, can silently alter live schema). Override
# with DDL_AUTO=validate (or none, backed by a real migration tool) when deploying.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration ? override JWT_SECRET in production; this default is for
# local development only.
jwt.secret=${JWT_SECRET:vetoraSuperSecretKey2026!@#$%^&*()_+ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email Configurations (Gmail SMTP) ? override via env vars in production
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:vetoracare@gmail.com}
spring.mail.password=${MAIL_PASSWORD:pfmf bypv trkj ygat}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS ? comma-separated list of allowed frontend origins. Override via
# CORS_ORIGINS in production (e.g. https://app.yourdomain.com).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173}

# Frontend URL used to build links inside emails (verification, etc).
# For local dev this defaults to localhost, which ONLY works when the email
# is opened on the same machine the backend runs on. To open the
# verification email on a phone or another computer, set this to your
# computer's LAN IP instead, e.g. FRONTEND_URL=http://192.168.1.5:5173
# (find your IP with `ipconfig` on Windows or `ifconfig`/`ip addr` on
# Mac/Linux), then restart the backend.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}


