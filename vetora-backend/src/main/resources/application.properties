# Datasource ? override in production via env vars (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vetora_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA / Hibernate Configurations
# ddl-auto=update is convenient for local dev (auto-creates/alters tables) but
# risky in production (no rollback, can silently alter live schema). Override
# with DDL_AUTO=validate (or none, backed by a real migration tool) when deploying.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

